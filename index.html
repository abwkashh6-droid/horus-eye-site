<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="description" content="HORUS — a new Mediterranean experience, El Hamam, Matrouh"><meta name="theme-color" content="#050d1c"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HORUS</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--navy:#050d1c;--ocean:#0b2a4a;--med:#1d6fa5;--sand:#d9c3a0;--ivory:#f6f1e7;--gold:#c9a45c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--navy);color:var(--ivory);font:300 16px/1.8 Cairo,sans-serif}
h1,h2,h3{font-family:'Cormorant Garamond',Cairo,serif;font-weight:600;margin:0}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:linear-gradient(#0b2a4a,#e8a77a)}
main{position:relative;z-index:1}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:18px;padding:calc(12px + env(safe-area-inset-top,0px)) 5vw 12px;background:linear-gradient(rgba(5,13,28,.85),transparent)}
nav .lg{height:44px;width:auto}
nav b{letter-spacing:.3em;font-family:'Cormorant Garamond',serif;font-size:20px}nav .sp{flex:1}
nav a{color:var(--ivory);text-decoration:none;font-size:14px;opacity:.85}
.btn{background:none;border:1px solid var(--gold);color:var(--ivory);padding:10px 22px;letter-spacing:.12em;font:500 13px Cairo;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover,.btn.f{background:var(--gold);color:var(--navy)}
.sec{min-height:100svh;padding:14vh 6vw}.solid{background:var(--navy)}
#hero{background:radial-gradient(ellipse at center,rgba(5,13,28,.6),transparent 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
#hero .em{width:min(230px,52vw);height:auto;filter:drop-shadow(0 6px 30px #000c)}
#hero h1{font-size:clamp(54px,13vw,150px);letter-spacing:.3em;margin-inline-end:-.3em;line-height:1}
#hero p{letter-spacing:.35em;font-size:clamp(11px,2.4vw,16px);color:var(--sand);margin:0}
#jr{height:260vh}#jr .st{position:sticky;top:0;height:100svh;display:grid;place-items:center;text-align:center;padding:0 8vw}
.cap{grid-area:1/1;font:600 clamp(28px,6vw,64px)/1.2 'Cormorant Garamond',Cairo,serif;opacity:0;text-shadow:0 2px 30px #000}
h2{font-size:clamp(32px,5vw,58px);margin-bottom:8px}.k{color:var(--gold);letter-spacing:.3em;font-size:12px}.k::before{content:"";display:inline-block;width:36px;height:1px;background:var(--gold);vertical-align:middle;margin-inline-end:12px}.btn{transition:.3s}.uc{transition:.3s}.uc:hover{transform:translateY(-4px)}footer{border-top:1px solid #ffffff1a;background:var(--navy)}
.rv{opacity:0;transform:translateY(24px);transition:1s}.rv.in{opacity:1;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;margin-top:24px}
.uc{border:1px solid #ffffff22;padding:22px;cursor:pointer;position:relative;background:#0b2a4a55}.uc:hover{border-color:var(--gold)}
.bd,.demo{font-size:11px;letter-spacing:.1em;padding:2px 10px;border:1px solid var(--gold);color:var(--gold)}.demo{color:#ffb4a0;border-color:#ffb4a0;margin-inline-start:6px}
.bd.sold{opacity:.5}.bd.reserved{color:var(--sand)}
.flt{display:flex;gap:10px;flex-wrap:wrap}select,input,textarea{background:#0b2a4a;color:var(--ivory);border:1px solid #ffffff33;padding:10px;font:inherit;width:100%}
.flt select{width:auto}
#pw{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}@media(max-width:800px){#pw{grid-template-columns:1fr}}
#pl{width:100%;background:var(--ocean);border:1px solid #ffffff22;touch-action:none;cursor:grab}
.zn circle{fill:#c9a45c55;stroke:var(--gold);stroke-width:.3;cursor:pointer}.zn text{font-size:2px;fill:#fff;pointer-events:none}.zn.on circle{fill:#c9a45caa}
.note{color:#ffb4a0;font-size:12px;letter-spacing:.08em}
#pi{border:1px solid #ffffff22;padding:20px;min-height:160px}
form{display:grid;gap:12px;max-width:520px}.ct{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:800px){.ct{grid-template-columns:1fr}}
dialog{background:var(--navy);color:var(--ivory);border:1px solid var(--gold);max-width:520px;width:92%}dialog::backdrop{background:#000a}
#dr{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(440px,100%);background:#07162b;z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;border-inline-start:1px solid var(--gold);direction:ltr;text-align:left}
#dr label{display:block;font-size:12px;margin:8px 0 2px;color:var(--sand)}.ck{display:flex!important;gap:8px;align-items:center}.ck input{width:auto}
.ed{border:1px solid #ffffff22;margin:8px 0;padding:8px}.row{display:flex;gap:8px;margin-top:10px}.th{width:80px;margin-top:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);padding:10px 20px;z-index:40;display:none}#toast.er{background:#ffb4a0}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:#ffffff22;margin:28px 0}.facts div{background:var(--navy);padding:18px;text-align:center}.facts b{display:block;font:600 clamp(20px,3vw,30px) 'Cormorant Garamond',Cairo,serif;color:var(--gold)}.facts span{font-size:12px;color:var(--sand);letter-spacing:.1em}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:40px}@media(max-width:800px){.pc{grid-template-columns:1fr}}
#fl{list-style:none;padding:0;columns:2;margin:12px 0 0}#fl li{break-inside:avoid}#fl li::before{content:"◆ ";color:var(--gold);font-size:9px}
.pcard{border:1px solid #ffffff22;padding:14px 18px;margin-top:10px;display:flex;justify-content:space-between;gap:10px;align-items:center}.pcard b{color:var(--gold);font-size:22px;white-space:nowrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:34px}.gal figure{margin:0;cursor:zoom-in}.gal img{width:100%;height:230px;object-fit:cover;display:block}.gal figcaption{font-size:12px;color:var(--sand);padding:6px 0}
#pl{max-height:88vh}.zn text{paint-order:stroke;stroke:#000;stroke-width:.5px}
@media(max-width:760px){nav{flex-wrap:wrap;gap:6px 14px}nav .sp,nav b{display:none}nav a{font-size:12px}}
footer{padding:40px 6vw;text-align:center;color:var(--sand);font-size:13px}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
</style></head><body>
